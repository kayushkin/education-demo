# Paste inside the kayushkin.com server block, BEFORE the catch-all `location /`.
#
# The prefix is kept on the way through (no trailing slash on proxy_pass), so
# the Go server sees /education-demo/... and its -base-path matches.
location /education-demo {
    proxy_pass http://127.0.0.1:8316;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # The dashboard holds an SSE stream open for the whole lesson. Without
    # these three it dies at the default 60s read timeout, and buffering holds
    # every event back until a buffer fills, which makes a live feed look
    # frozen.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
}
